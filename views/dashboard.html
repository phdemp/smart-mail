<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntelliMail — Dashboard</title>
  <script>
  (function () {
    const token = localStorage.getItem('intellimail_token');
    if (!token) {
      fetch('/api/users/any').then(r => r.json()).then(d => {
        location.href = d.any ? '/login' : '/setup';
      }).catch(() => { location.href = '/login'; });
    }
  })();
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <!-- app.js loaded in head so its htmx:configRequest listener registers BEFORE any
       hx-trigger="load" element fires its XHR. Without this the dashboard bounces to /login. -->
  <script src="/js/app.js"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="app-shell" x-data="appState()" x-init="init()">

  <!-- LLM-not-configured banner (shown when no cloud key is saved) -->
  <template x-if="llmStatus && llmStatus.has_cloud_keys === false">
    <div style="grid-column:1/-1;background:rgba(245,158,11,0.12);border-bottom:1px solid rgba(245,158,11,0.35);color:var(--text-primary);padding:10px 18px;display:flex;align-items:center;gap:12px;font-size:13px;">
      <span style="font-size:16px;">⚠️</span>
      <div style="flex:1;">
        <b>Smart classification is disabled.</b>
        Add a Groq, Gemini, or DeepSeek key in Settings → AI Providers to classify beyond simple pattern matching.
        <template x-if="llmStatus.fallback_count > 0">
          <span style="color:var(--text-muted);"> <span x-text="llmStatus.fallback_count"></span> emails are currently in "All Other" and can be reclassified once configured.</span>
        </template>
      </div>
      <a href="/settings" class="action-btn btn-primary" style="font-size:12px;padding:6px 14px;text-decoration:none;">Open Settings</a>
    </div>
  </template>

  <!-- Providers-unhealthy banner (keys saved, but all providers failing) -->
  <template x-if="llmStatus && llmStatus.has_cloud_keys === true && llmStatus.any_provider_usable === false">
    <div style="grid-column:1/-1;background:rgba(239,68,68,0.12);border-bottom:1px solid rgba(239,68,68,0.35);color:var(--text-primary);padding:10px 18px;display:flex;align-items:center;gap:12px;font-size:13px;">
      <span style="font-size:16px;">⚠️</span>
      <div style="flex:1;">
        <b>All LLM providers are unavailable.</b>
        <template x-for="(h, name) in (llmStatus.provider_health || {})" :key="'ph-'+name">
          <template x-if="h.status && h.status !== 'ok' && h.status !== 'unknown'">
            <span style="margin-right:10px;color:var(--text-muted);">
              <span x-text="name"></span>: <span x-text="h.status.replace('_',' ')"></span>
            </span>
          </template>
        </template>
      </div>
      <a href="/settings" class="action-btn btn-primary" style="font-size:12px;padding:6px 14px;text-decoration:none;">Open Settings</a>
    </div>
  </template>

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar" :class="{'collapsed': sidebarCollapsed}">

    <!-- Logo -->
    <div class="sidebar-logo">
      <span class="sidebar-brand">✉ IntelliMail</span>
      <div class="sidebar-logo-actions">
        <button class="theme-btn sidebar-expand-only" @click="toggleTheme()"
                :title="theme==='dark'?'Light mode':'Dark mode'"
                x-text="theme==='dark'?'☀':'🌙'"></button>
        <button class="sidebar-toggle" @click="toggleSidebar()" :title="sidebarCollapsed?'Expand':'Collapse'">
          <span x-text="sidebarCollapsed ? '›' : '‹'"></span>
        </button>
      </div>
    </div>

    <style>
      @keyframes classify-pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.4; }
      }
    </style>
    <!-- Classifying pill: visible whenever the backlog is > 0 -->
    <template x-if="pendingClassifying > 0">
      <div class="sidebar-expand-only" style="padding:8px 14px;margin:4px 10px;background:rgba(6,182,212,0.1);border:1px solid rgba(6,182,212,0.3);border-radius:8px;font-size:11px;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--accent-cyan);animation:classify-pulse 1.4s ease-in-out infinite;"></span>
          <span style="color:var(--text-primary);font-weight:600;">Classifying</span>
          <span style="color:var(--text-muted);margin-left:auto;font-family:'IBM Plex Mono',monospace;">
            <span x-text="classifyTotal - pendingClassifying"></span>/<span x-text="classifyTotal"></span>
          </span>
        </div>
        <div style="height:4px;background:var(--bg-raised);border-radius:2px;overflow:hidden;">
          <div :style="`height:100%;width:${classifyPct}%;background:var(--accent-cyan);transition:width 400ms ease-out;`"></div>
        </div>
      </div>
    </template>
    <!-- Collapsed state: just a pulsing cyan dot -->
    <template x-if="pendingClassifying > 0 && sidebarCollapsed">
      <div style="display:none;" class="sidebar-collapsed-only" :style="sidebarCollapsed ? 'display:flex;justify-content:center;padding:4px 0;' : 'display:none;'">
        <span style="width:10px;height:10px;border-radius:50%;background:var(--accent-cyan);animation:classify-pulse 1.4s ease-in-out infinite;"></span>
      </div>
    </template>

    <!-- Smart Folders (loaded via HTMX) -->
    <div id="sidebar-nav"
         hx-get="/api/sidebar"
         hx-trigger="load, statsUpdate from:body"
         hx-swap="innerHTML"
         style="flex:1;overflow-y:auto;">
      <!-- Loading state -->
      <div style="padding:16px;">
        <div class="skeleton" style="height:32px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:32px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:32px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:32px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:32px;"></div>
      </div>
    </div>

    <!-- Bottom bar: status dot + Settings + Disconnect -->
    <div class="sidebar-bottom" style="padding:8px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;">

      <!-- Status dot (always visible, reflects IMAP state) -->
      <span :class="{'sync-live': syncMode==='idle'}"
            :style="{
              fontSize:'8px', flexShrink:0,
              color: syncMode==='idle'?'var(--accent-cyan)':syncMode==='polling'?'var(--accent-amber)':syncMode==='disconnected'?'var(--accent-red)':'var(--text-muted)'
            }"
            :title="syncMode==='idle'?'Live IDLE':syncMode==='polling'?'Polling':syncMode==='disconnected'?'Offline':'Connecting'">●</span>

      <!-- Settings link -->
      <a href="/settings" style="flex:1;display:flex;align-items:center;gap:8px;color:var(--text-muted);text-decoration:none;font-size:13px;transition:color 150ms;min-width:0;"
         onmouseenter="this.style.color='var(--text-primary)'" onmouseleave="this.style.color='var(--text-muted)'">
        <span style="flex-shrink:0;">⚙️</span>
        <span class="sidebar-expand-only" style="font-family:'Syne',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Settings</span>
      </a>

      <!-- Log out -->
      <button @click="logout()" title="Log out"
              style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:4px 5px;border-radius:4px;line-height:1;flex-shrink:0;transition:color 150ms;"
              onmouseenter="this.style.color='var(--accent-red)'" onmouseleave="this.style.color='var(--text-muted)'">⏻</button>
    </div>

  </aside>

  <!-- CENTER PANEL: Email List -->
  <section class="email-list-panel">

    <!-- Panel Header with search -->
    <div class="panel-header">
      <input class="search-input"
             type="search"
             placeholder="Search emails..."
             hx-get="/api/emails"
             hx-trigger="input changed delay:400ms"
             hx-target="#email-list"
             hx-swap="innerHTML"
             hx-include="[name='folder'],[name='category']"
             name="search">
      <input type="hidden" name="folder" value="INBOX">
      <input type="hidden" name="category" value="all">
      <button class="action-btn btn-ghost" style="padding:6px 10px;font-size:12px;flex-shrink:0;"
              hx-post="/api/sync/now"
              hx-swap="none"
              onclick="showToast('info','⟳ Syncing...')">
        ⟳
      </button>
    </div>

    <!-- Email List -->
    <div id="email-list"
         hx-get="/api/emails?folder=INBOX&category=all"
         hx-trigger="load, categoryChange from:body, refresh"
         hx-swap="innerHTML"
         style="flex:1;overflow-y:auto;">
      <!-- Skeleton loaders while loading -->
      <div style="padding:12px 16px;" class="htmx-indicator">
        <div class="skeleton" style="height:80px;margin-bottom:8px;border-radius:4px;"></div>
        <div class="skeleton" style="height:80px;margin-bottom:8px;border-radius:4px;"></div>
        <div class="skeleton" style="height:80px;margin-bottom:8px;border-radius:4px;"></div>
        <div class="skeleton" style="height:80px;margin-bottom:8px;border-radius:4px;"></div>
        <div class="skeleton" style="height:80px;border-radius:4px;"></div>
      </div>
    </div>

  </section>

  <!-- RIGHT PANEL: Email Detail -->
  <section class="email-detail-panel">

    <!-- Demo banner (shown when no account config) -->
    <div id="demo-banner"
         hx-get="/api/stats"
         hx-trigger="load"
         hx-swap="none"
         style="display:none;">
    </div>

    <!-- Empty state -->
    <div id="email-detail"
         style="height:100%;display:flex;flex-direction:column;">
      <div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text-muted);padding:48px;">
        <div style="font-size:48px;opacity:0.3;">✉</div>
        <div style="font-family:'Syne',sans-serif;font-size:15px;font-weight:600;">Select an email to read</div>
        <div style="font-size:13px;font-family:'Literata',serif;font-style:italic;text-align:center;max-width:300px;line-height:1.6;">
          IntelliMail classifies every email using Claude AI — meeting requests, financials, legal notices, travel, and more.
        </div>
        <div id="demo-mode-check" hx-get="/api/account/test" hx-trigger="load" hx-swap="none"></div>
      </div>
    </div>

  </section>

  <!-- TOAST CONTAINER -->
  <div id="toast-container"></div>

</div>

<!-- Check demo mode and show banner -->
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const r = await authFetch('/api/stats');
      // If we get stats, check if demo mode by testing account
      const testR = await authFetch('/api/account/test');
      // account/test requires query params; if no config, it will error
    } catch(e) {}

    // Check if demo mode by fetching config status
    try {
      const r = await authFetch('/api/sync/status');
      const data = await r.json();
      if (data.mode === 'demo') {
        // Show demo banner
        const detailPanel = document.querySelector('.email-detail-panel');
        if (detailPanel) {
          const banner = document.createElement('div');
          banner.className = 'demo-banner';
          banner.innerHTML = `
            <span>📧 DEMO MODE — Connect your email account to get started</span>
            <a href="/setup" style="background:var(--accent-amber);color:#000;padding:4px 12px;border-radius:4px;text-decoration:none;font-weight:600;font-size:11px;white-space:nowrap;">Connect Account →</a>
          `;
          detailPanel.insertBefore(banner, detailPanel.firstChild);
        }
        // Also show in email list panel
        const listPanel = document.querySelector('.email-list-panel');
        if (listPanel) {
          const banner2 = document.createElement('div');
          banner2.className = 'demo-banner';
          banner2.style.cssText = 'font-size:11px;padding:6px 12px;';
          banner2.innerHTML = `<span>DEMO MODE</span><a href="/setup" style="color:var(--accent-amber);text-decoration:underline;">Connect Account</a>`;
          listPanel.insertBefore(banner2, listPanel.firstChild);
        }
      }
    } catch(e) {}
  });
</script>

<!-- Shared confirmation modal — window.confirmModal(title, message, opts) returns Promise<boolean> -->
<div x-data="confirmModalComponent()" @keydown.escape.window="open && cancel()">
  <!-- Backdrop -->
  <div x-show="open" x-transition.opacity @click="cancel()" x-cloak
       style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:10000;"></div>
  <!-- Dialog -->
  <div x-show="open" x-transition @click.stop x-cloak
       style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:50vw;max-width:600px;min-width:320px;background:var(--bg-raised);border:1px solid var(--border);border-radius:12px;padding:24px 28px;box-shadow:0 24px 60px rgba(0,0,0,0.55);z-index:10001;">
    <h3 x-text="title" style="margin:0 0 10px;font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:var(--text-primary);letter-spacing:-0.01em;"></h3>
    <p x-text="message" style="margin:0 0 22px;font-size:13px;color:var(--text-muted);line-height:1.6;"></p>
    <div style="display:flex;justify-content:flex-end;gap:10px;">
      <button @click="cancel()" class="action-btn btn-ghost" style="min-width:96px;">Cancel</button>
      <button @click="confirm()" class="action-btn" :class="danger ? 'btn-decline' : 'btn-primary'" x-text="confirmLabel" style="min-width:112px;"></button>
    </div>
  </div>
</div>
<style>[x-cloak] { display: none !important; }</style>

</body>
</html>
